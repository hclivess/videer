name: Feature request
description: Suggest an option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, not just the button you'd like.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: ffmpeg
    attributes:
      label: Equivalent FFmpeg / AviSynth command (if known)
      description: If you already do this on the command line, paste the command — it usually maps straight onto an option.
      render: shell
